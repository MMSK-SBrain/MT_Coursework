title: TUV SUD Automotive Technician Course
description: Lecture frameworks and question banks for the TUV SUD Automotive Technician program
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme

# Only index.md and the TUV SUD course are published.
exclude:
  - "*.py"
  - "*.xlsx"
  - "*.docx"
  - "*.pptx"
  - "*.pdf"
  - "*.zip"
  - "*.txt"
  - "*.yaml"
  - README.md
  - .claude
  - docs
  - legacy
  - reference
  - app
  - apps
  - packages
  - node_modules
  - courses/aezc517-systems-engineering
  - courses/aelzc441-automotive-vehicles
  - courses/aezc516-ice
